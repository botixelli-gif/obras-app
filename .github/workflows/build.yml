name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/obras.jks
          cat > android/key.properties <<PROPS
          storeFile=app/obras.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=obras
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk obras.apk
      - uses: actions/upload-artifact@v4
        with:
          name: obras-android
          path: obras.apk
      # Cada versión de main se publica como "release": el enlace
      # releases/latest/download/obras.apk siempre da la última.
      - name: Publicar versión
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v1.0.${{ github.run_number }}" obras.apk
          --target "${{ github.sha }}"
          --title "Obras 1.0.${{ github.run_number }}"
          --notes "Versión de prueba para Android. Instala obras.apk en el móvil."
          --latest
